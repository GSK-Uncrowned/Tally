<div style="background:#f4f4f0;margin:0;padding:40px 16px;font-family:Arial,Helvetica,sans-serif;color:#171717">
  <div style="max-width:560px;margin:0 auto">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:30px;font-weight:700;letter-spacing:-1px">Tally</div>
      <div style="font-size:12px;color:#777;margin-top:4px;letter-spacing:1px;text-transform:uppercase">Simple sewing records</div>
    </div>
    <div style="background:#fff;border:1px solid #e1e1dc;border-radius:16px;padding:40px 32px">
      <h1 style="font-size:28px;line-height:1.2;margin:0 0 16px">Confirm your email</h1>
      <p style="font-size:16px;line-height:1.6;margin:0 0 28px;color:#444">
        Thanks for signing up for Tally. Confirm your email address to finish creating your account.
      </p>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#171717;color:#fff;text-decoration:none;border-radius:10px;padding:14px 22px;font-size:15px;font-weight:700">
        Confirm email address
      </a>
      <p style="font-size:13px;line-height:1.6;margin:28px 0 0;color:#777">
        If you did not create a Tally account, you can safely ignore this email.
      </p>
    </div>
    <p style="font-size:12px;line-height:1.5;text-align:center;color:#888;margin:20px 12px 0">
      Tally · Keep every piece counted
    </p>
  </div>
</div>
