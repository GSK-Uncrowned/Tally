<!DOCTYPE html>
<html lang="en" class="halloween"><!-- HALLOWEEN: remove class="halloween" to switch the theme off -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Gochi+Hand&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="tutorial.css">
<!-- HALLOWEEN theme: delete these two lines to remove it completely -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
<link rel="stylesheet" href="theme-halloween.css">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="loading-screen">
<canvas id="mesh-background" aria-hidden="true"></canvas>
<div id="busy" role="status" aria-live="polite" aria-label="Loading Tally"><div class="tl" aria-hidden="true"><svg viewBox="0 7 48 35"><line class="tl-l m0" x1="10" y1="11" x2="10.9" y2="38" pathLength="1"/><line class="tl-l m1" x1="19" y1="10" x2="18.3" y2="39.5" pathLength="1"/><line class="tl-l m2" x1="28" y1="12.5" x2="28.8" y2="37" pathLength="1"/><line class="tl-l m3" x1="37" y1="10" x2="36.8" y2="38.5" pathLength="1"/><line class="tl-l sl" x1="2.5" y1="37" x2="45.5" y2="12" pathLength="1"/></svg><span class="tl-word">Tally</span></div></div>
<div class="app">
  <nav>
    <div class="brand" data-act="brand"><svg viewBox="0 7 48 35" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" aria-hidden="true"><line x1="10" y1="11" x2="10.9" y2="38"/><line x1="19" y1="10" x2="18.3" y2="39.5"/><line x1="28" y1="12.5" x2="28.8" y2="37"/><line x1="37" y1="10" x2="36.8" y2="38.5"/><line x1="2.5" y1="37" x2="45.5" y2="12" stroke-width="3.2"/></svg><span class="brand-word">Tally</span></div>
    <button data-view="log" data-i18n="nav.log" data-nav-en="Log">Log</button>
    <button data-view="sewers" data-i18n="nav.salary" data-nav-en="Salary">Salary</button>
    <button data-view="suppliers" data-i18n="nav.suppliers" data-nav-en="Suppliers">Suppliers</button>
    <button data-view="finance" data-i18n="nav.finance" data-nav-en="Finance">Finance</button>
    <button data-view="setup" data-i18n="nav.setup" data-nav-en="Setup">Setup</button>
    <button data-view="my-log" data-i18n="nav.myLogs">My logs</button>
    <button data-view="my-finance" data-i18n="nav.finance">Finance</button>
    <button data-view="my-salary" data-i18n="nav.salary">Salary</button>
  </nav>
  <div class="workspace">
    <header class="topbar" id="topbar" hidden></header>
    <main id="main"></main>
  </div>
</div>

<dialog id="dlg">
  <div id="wizard"></div>
  <p id="err" role="alert"></p>
  <div class="actions"><button class="btn" data-act="wizard-back" data-i18n="common.back">Back</button><button class="primary" data-act="wizard-next">Continue</button></div>
</dialog>

<dialog id="rate-dlg">
  <h2 style="margin-top:0" data-i18n="rate.title">Set price &amp; sewer pay</h2>
  <p class="muted" id="rate-context"></p>
  <label class="required" for="r-price" data-i18n="rate.price">Price per piece (₱)</label><input class="in" id="r-price" type="number" min="0" step="0.01">
  <label class="required" for="r-pay" data-i18n="rate.pay">Sewer pay per piece (₱)</label><input class="in" id="r-pay" type="number" min="0" step="0.01">
  <p id="rate-err" role="alert"></p>
  <div class="actions"><button class="btn" data-act="rate-cancel" data-i18n="common.cancel">Cancel</button><button class="primary" data-act="rate-save" data-i18n="rate.save">Save rate</button></div>
</dialog>

<dialog id="fin-dlg" aria-label="Finalize week"></dialog>
<dialog id="receipt-dlg" aria-label="Receipt"></dialog>

<div id="auth" hidden>
  <div class="authbox">
    <div class="auth-brand"><svg viewBox="0 7 48 35" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" aria-hidden="true"><line x1="10" y1="11" x2="10.9" y2="38"/><line x1="19" y1="10" x2="18.3" y2="39.5"/><line x1="28" y1="12.5" x2="28.8" y2="37"/><line x1="37" y1="10" x2="36.8" y2="38.5"/><line x1="2.5" y1="37" x2="45.5" y2="12" stroke-width="3.2"/></svg><span class="brand-word">Tally</span></div>
    <h1 id="a-title">Welcome back</h1>
    <p class="muted" id="a-sub">Log in to continue</p>
    <label class="required" for="a-email" data-i18n="auth.email">Email</label><input class="in" id="a-email" type="email" autocomplete="email" required>
    <label class="required" for="a-pass" data-i18n="auth.password">Password</label><input class="in" id="a-pass" type="password" autocomplete="current-password" required>
    <p id="a-err" role="alert"></p>
    <button class="primary" id="a-go" data-act="auth-go">Log in</button>
    <div class="auth-divider"><span data-i18n="auth.or">or</span></div>
    <button class="oauth-btn" data-act="auth-google"><svg class="google-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.4-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.22Z"/><path fill="#34A853" d="M12 21.67c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.55 0-4.71-1.72-5.49-4.03H3.27v2.53A9.74 9.74 0 0 0 12 21.67Z"/><path fill="#FBBC05" d="M6.51 13.77A5.85 5.85 0 0 1 6.2 12c0-.61.11-1.2.31-1.77V7.7H3.27A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.02 4.3l3.24-2.53Z"/><path fill="#EA4335" d="M12 6.2c1.44 0 2.73.5 3.75 1.48l2.81-2.81C16.84 3.25 14.63 2.33 12 2.33a9.74 9.74 0 0 0-8.73 5.37l3.24 2.53C7.29 7.92 9.45 6.2 12 6.2Z"/></svg><span data-i18n="auth.google">Continue with Google</span></button>
    <button class="textbtn" id="a-switch" data-act="auth-mode">Don't have an account? <strong>Sign up</strong></button>
  </div>
</div>
<div id="confirm-modal" class="confirm-modal" hidden>
  <section class="confirm-panel" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-icon" id="confirm-icon" aria-hidden="true">✉</div>
    <h2 id="confirm-title">Check your email</h2>
    <p id="confirm-message">We sent a confirmation link to <strong id="confirm-email"></strong>. Open it to activate your account.</p>
    <div id="confirm-actions">
      <button class="primary" data-act="auth-resend" data-i18n="auth.resend">Resend email</button>
      <button class="textbtn" data-act="auth-back" data-i18n="auth.backToSignup">Back to sign up</button>
      <button class="textbtn" data-act="auth-test-confirm" hidden>Simulate email confirmation</button>
    </div>
    <p id="confirm-status" role="status"></p>
  </section>
</div>
<div id="onboarding" class="confirm-modal" hidden>
  <section class="confirm-panel onboarding-panel" role="dialog" aria-modal="true" aria-labelledby="onboarding-title">
    <button class="onboarding-close" data-act="onboarding-exit" aria-label="Exit organization setup">&times;</button>
    <div class="auth-brand"><svg viewBox="0 7 48 35" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" aria-hidden="true"><line x1="10" y1="11" x2="10.9" y2="38"/><line x1="19" y1="10" x2="18.3" y2="39.5"/><line x1="28" y1="12.5" x2="28.8" y2="37"/><line x1="37" y1="10" x2="36.8" y2="38.5"/><line x1="2.5" y1="37" x2="45.5" y2="12" stroke-width="3.2"/></svg><span class="brand-word">Tally</span></div>
    <h2 id="onboarding-title" data-i18n="onb.title">Set up your workspace</h2>
    <div id="onboarding-content"></div>
    <p id="onboarding-status" role="alert"></p>
  </section>
</div>
<div id="scan-modal" class="confirm-modal scan-modal" hidden>
  <section class="confirm-panel scan-panel" role="dialog" aria-modal="true" aria-labelledby="scan-title">
    <button class="onboarding-close" data-act="scan-close" aria-label="Close scanner">&times;</button>
    <div class="scan-main">
      <h2 id="scan-title" data-i18n="scan.title">Scan invite QR code</h2>
      <div id="qr-reader" class="qr-reader"></div>
      <p id="scan-status" role="alert"></p>
    </div>
    <div class="scan-success" role="status">
      <svg class="ok-svg" viewBox="0 0 120 120" aria-hidden="true">
        <g class="ok-burst">
          <g transform="rotate(0 60 60)"><line x1="60" y1="20" x2="60" y2="4" pathLength="1"/></g>
          <g transform="rotate(30 60 60)"><line x1="60" y1="20" x2="60" y2="4" pathLength="1"/></g>
          <g transform="rotate(60 60 60)"><line x1="60" y1="20" x2="60" y2="4" pathLength="1"/></g>
          <g transform="rotate(90 60 60)"><line x1="60" y1="20" x2="60" y2="4" pathLength="1"/></g>
          <g transform="rotate(120 60 60)"><line x1="60" y1="20" x2="60" y2="4" pathLength="1"/></g>
          <g transform="rotate(150 60 60)"><line x1="60" y1="20" x2="60" y2="4" pathLength="1"/></g>
          <g transform="rotate(180 60 60)"><line x1="60" y1="20" x2="60" y2="4" pathLength="1"/></g>
          <g transform="rotate(210 60 60)"><line x1="60" y1="20" x2="60" y2="4" pathLength="1"/></g>
          <g transform="rotate(240 60 60)"><line x1="60" y1="20" x2="60" y2="4" pathLength="1"/></g>
          <g transform="rotate(270 60 60)"><line x1="60" y1="20" x2="60" y2="4" pathLength="1"/></g>
          <g transform="rotate(300 60 60)"><line x1="60" y1="20" x2="60" y2="4" pathLength="1"/></g>
          <g transform="rotate(330 60 60)"><line x1="60" y1="20" x2="60" y2="4" pathLength="1"/></g>
        </g>
        <g class="ok-icon">
          <circle class="ok-ring" cx="60" cy="60" r="36" pathLength="1" transform="rotate(-90 60 60)"/>
          <path class="ok-check" d="M44 61 L56 73 L78 49" pathLength="1"/>
        </g>
      </svg>
      <p class="ok-text" data-i18n="scan.done">Code scanned</p>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="tutorial.js"></script>
<script src="app.js"></script>
</body>
</html>
